[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "quant-research"
version = "0.1.0"
description = "A reproducible foundation for cross-market quantitative research."
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = []

[project.scripts]
quant-data = "quant_research.taiwan.cli:main"

[dependency-groups]
dev = [
    "mypy>=1.15",
    "pytest>=8.3",
    "ruff>=0.11",
]

[tool.hatch.build.targets.wheel]
packages = ["src/quant_research"]

[tool.mypy]
python_version = "3.13"
strict = true
files = ["src/quant_research"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--import-mode=importlib"]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
